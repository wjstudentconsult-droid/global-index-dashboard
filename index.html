<script>
/* ===== ข้อมูล IMD ฝังจากไฟล์ WCC_rankings_data_2026.xlsx: World Competitiveness 2026 (70 เศรษฐกิจ, 395 คอลัมน์),
 World Digital Competitiveness 2026, World Talent 2025 — อัปเดตปีใหม่โดยกด "นำเข้า IMD" แล้วเลือกไฟล์ WCC rankings data ของปีนั้น ===== */
/* ===== IMD: โครงสร้างข้อมูลจากไฟล์ WCC rankings data (Values/Ranks/Codebook) ===== */
const IMDN=Object.fromEntries("Argentina:ARG|Australia:AUS|Austria:AUT|Bahrain:BHR|Belgium:BEL|Botswana:BWA|Brazil:BRA|Bulgaria:BGR|Canada:CAN|Chile:CHL|China:CHN|Colombia:COL|Croatia:HRV|Cyprus:CYP|Czech Republic:CZE|Denmark:DNK|Estonia:EST|Finland:FIN|France:FRA|Germany:DEU|Ghana:GHA|Greece:GRC|Hong Kong SAR:HKG|Hungary:HUN|Iceland:ISL|India:IND|Indonesia:IDN|Ireland:IRL|Italy:ITA|Japan:JPN|Jordan:JOR|Kazakhstan:KAZ|Kenya:KEN|Korea Rep.:KOR|Kuwait:KWT|Latvia:LVA|Lithuania:LTU|Luxembourg:LUX|Malaysia:MYS|Mexico:MEX|Mongolia:MNG|Namibia:NAM|Netherlands:NLD|New Zealand:NZL|Nigeria:NGA|Norway:NOR|Oman:OMN|Peru:PER|Philippines:PHL|Poland:POL|Portugal:PRT|Puerto Rico:PRI|Qatar:QAT|Romania:ROU|Saudi Arabia:SAU|Singapore:SGP|Slovak Republic:SVK|Slovenia:SVN|South Africa:ZAF|Spain:ESP|Sweden:SWE|Switzerland:CHE|Taiwan (Chinese Taipei):TWN|Thailand:THA|Türkiye:TUR|UAE:ARE|United Kingdom:GBR|USA:USA|Venezuela:VEN|Vietnam:VNM".split("|").map(s=>{const i=s.lastIndexOf(":");return[s.slice(0,i).toLowerCase(),s.slice(i+1)]}));
const IMDE={};for(const k in IMDN)IMDE[IMDN[k]]=k.replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/^Uae$/,"UAE").replace(/^Usa$/,"USA").replace(" Sar"," SAR");
const FAM={W:["World Competitiveness Ranking","WCR"],D:["World Digital Competitiveness Ranking","Digital"],T:["World Talent Ranking","Talent"]};
const THX={"overall":"ภาพรวม","economic performance":"ผลการดำเนินงานเศรษฐกิจ","domestic economy":"เศรษฐกิจในประเทศ","international trade":"การค้าระหว่างประเทศ","international investment":"การลงทุนระหว่างประเทศ","employment":"การจ้างงาน","prices":"ระดับราคา","government efficiency":"ประสิทธิภาพภาครัฐ","public finance":"การคลังภาครัฐ","tax policy":"นโยบายภาษี","institutional framework":"กรอบการบริหารด้านสถาบัน","business legislation":"กฎหมายด้านธุรกิจ","societal framework":"กรอบการบริหารด้านสังคม","business efficiency":"ประสิทธิภาพภาคธุรกิจ","productivity & efficiency":"ผลิตภาพและประสิทธิภาพ","labor market":"ตลาดแรงงาน","finance":"การเงิน","management practices":"การบริหารจัดการ","attitudes & values":"ทัศนคติและค่านิยม","infrastructure":"โครงสร้างพื้นฐาน","basic infrastructure":"โครงสร้างพื้นฐานทั่วไป","technological infrastructure":"โครงสร้างพื้นฐานด้านเทคโนโลยี","scientific infrastructure":"โครงสร้างพื้นฐานด้านวิทยาศาสตร์","health & environment":"สุขภาพและสิ่งแวดล้อม","education":"การศึกษา",
"governance":"ธรรมาภิบาล","regulatory framework":"กรอบกฎระเบียบ","digital & ai governance":"การกำกับดูแลดิจิทัลและ AI","public leadership":"ภาวะผู้นำภาครัฐ","technology & infrastructure":"เทคโนโลยีและโครงสร้างพื้นฐาน","technological framework":"กรอบด้านเทคโนโลยี","capital & ai investment":"เงินทุนและการลงทุนด้าน AI","research infrastructure":"โครงสร้างพื้นฐานด้านการวิจัย","efficiency":"ประสิทธิภาพ","practices":"แนวปฏิบัติ","business agility":"ความคล่องตัวทางธุรกิจ","ai adoption":"การนำ AI มาใช้","workforce development":"การพัฒนากำลังคน","talent":"บุคลากรผู้มีความสามารถ","education & training":"การศึกษาและการฝึกอบรม","ai readiness":"ความพร้อมด้าน AI","values":"ค่านิยม","cybersecurity & ai ethics":"ความมั่นคงปลอดภัยไซเบอร์และจริยธรรม AI","societal attitudes":"ทัศนคติของสังคม","trust":"ความไว้วางใจ",
"investment & development":"การลงทุนและการพัฒนา","appeal":"การดึงดูด","readiness":"ความพร้อม"};
const rd=x=>{if(typeof x=="string"){x=x.trim();if(x===""||isNaN(x))return null;x=+x}if(typeof x!="number"||!isFinite(x))return null;return Math.abs(x)>=100?+x.toFixed(2):+x.toPrecision(4)};
const decamel=s=>s.replace(/([a-z0-9%)])([A-Z])/g,"$1 $2").replace(/\s*\/\s*/g," / ");
const nrm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
/* อ่านเวิร์กบุ๊ก IMD: หาแผ่น "<WCR|WCY|Digital|Talent> <ปี> [-] Values/Ranks/Codebook" ปีล่าสุดของแต่ละชุด
   คืน {sets:[{id,year,cols:[[key,code,name,unit,flag,level]],v:{ISO3:[]},r:{ISO3:[]}}],miss:[ชื่อที่แปลงรหัสไม่ได้]} */
function parseWCC(wb,toIso){
 const best={},miss=new Set(),sets=[];
 wb.SheetNames.forEach(n=>{const m=/^\s*(WCR|WCY|Digital|Talent)\s+(\d{4})\s*-?\s*(Values|Ranks|Code\s*book)\s*$/i.exec(n);if(!m)return;
  const fam=/^w/i.test(m[1])?"W":m[1][0].toUpperCase(),k=/^v/i.test(m[3])?"v":/^r/i.test(m[3])?"r":"c",o=best[fam]=best[fam]||{};(o[m[2]]=o[m[2]]||{})[k]=n});
 const A=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
 ["W","D","T"].forEach(fam=>{const o=best[fam];if(!o)return;const y=Object.keys(o).filter(y=>o[y].v&&o[y].r).sort().pop();if(!y)return;
  const V=A(o[y].v),R=A(o[y].r),cb={};
  if(o[y].c)A(o[y].c).forEach(r=>r.forEach((c,i)=>{const m=typeof c=="string"&&/^(\d+(?:\.\d+)+)\s+((?:\[[^\]]*\]\s*)*)(\S.*)$/.exec(c.trim());if(!m||cb[m[1]])return;
   const u=r.slice(i+1).find(v=>typeof v=="string"&&v.trim());cb[m[1]]={n:m[3].trim(),u:u?u.trim():"",f:/\[B\]/.test(m[2])?"B":/\[S\]/.test(m[2])?"S":""}}));
  const hd=M=>(M[0]||[]).map(h=>h==null?"":String(h).trim()),H=hd(V),RH=hd(R),cols=[],vi=[],ri=[];
  H.forEach((h,i)=>{if(!i||!h)return;const m=/^(\S+)(\s+)(.+)$/.exec(h);if(!m)return;
   const agg=m[2].length>1,code=m[1];let name=m[3].trim(),u="",f="",lv=agg?(code=="0"?0:code.split(".").length):3;
   if(agg){if(!lv)name="Overall"}else{const p=name.split("/"),c=cb[code],a=nrm(p[0]),b=c?nrm(c.n):"";
    if(c&&(b.startsWith(a)||a.startsWith(b))){name=c.n+(p.length>1?" / "+decamel(p.slice(1).join("/")):"");u=c.u;f=c.f}else name=decamel(name);
    if(p.length>1)lv=4}
   cols.push([h,code,name,u,f,lv]);vi.push(i);ri.push(RH.indexOf(h))});
  const v={},r={},load=(M,ix,dst)=>M.slice(1).forEach(row=>{const n=row&&row[0];if(typeof n!="string"||!n.trim())return;const iso=toIso(n.trim());if(!iso){miss.add(n.trim());return}
   dst[iso]=ix.map(i=>i<0?null:rd(row[i]))});
  load(V,vi,v);load(R,ri,r);
  for(const iso in v){const a=v[iso],b=r[iso]||(r[iso]=a.map(()=>null));b.forEach((x,j)=>{if(x===0){b[j]=null;if(a[j]===0)a[j]=null}})}
  if(cols.length&&Object.keys(v).length)sets.push({id:fam,year:y,cols,v,r})});
 return{sets,miss:[...miss]}}
/* อันดับ/คะแนนรวม จากชุด World Competitiveness */
function ovr(sets){const w=(sets||[]).find(s=>s.id=="W");if(!w)return null;const j=w.cols.findIndex(c=>c[5]===0);if(j<0)return null;
 return{year:w.year,rows:Object.keys(w.v).filter(k=>w.v[k][j]!=null&&w.r[k][j]!=null).map(k=>[k,w.r[k][j],+w.v[k][j].toFixed(2)]).sort((a,b)=>a[1]-b[1])}}
